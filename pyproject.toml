[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="ora-data-quality"
version="0.1.0"
description="Generate Oracle data-quality checks from DDL."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=["ora-doc @ git+https://github.com/raoulmunet/ora-doc.git"]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
ora-data-quality="ora_data_quality.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
